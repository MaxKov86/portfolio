<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Maks Kovalyov — Frontend Engineer</title>
    <meta
      name="description"
      content="Frontend engineer building production web apps with React, Next.js and TypeScript. Based in Mykolaiv, Ukraine. Open to contract and full-time work."
    />
    <link rel="canonical" href="https://maxkovalyov.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maks Kovalyov — Frontend Engineer" />
    <meta
      property="og:description"
      content="Production web apps with React, Next.js and TypeScript. Selected work, stack, and contacts."
    />
    <meta property="og:url" content="https://maxkovalyov.dev/" />
    <meta property="og:image" content="https://maxkovalyov.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Runs before first paint so the saved theme is applied without a flash.
      Keep this in sync with src/hooks/useTheme.ts (THEME_STORAGE_KEY).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.dataset.theme = saved;
            return;
          }
          var prefersLight = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          document.documentElement.dataset.theme = prefersLight
            ? "light"
            : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
